naftiko: 1.0.0-alpha2
info:
  label: frp Client Admin API — Status
  description: 'frp Client Admin API — Status. 1 operations. Lead operation: Get proxy status. Self-contained Naftiko capability
    covering one Frp business surface.'
  tags:
  - Frp
  - Status
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    FRP_API_KEY: FRP_API_KEY
capability:
  consumes:
  - type: http
    namespace: client-admin-status
    baseUri: http://{host}:{port}
    description: frp Client Admin API — Status business capability. Self-contained, no shared references.
    resources:
    - name: api-status
      path: /api/status
      operations:
      - name: getstatus
        method: GET
        description: Get proxy status
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: basic
      username: '{{env.FRP_USER}}'
      password: '{{env.FRP_PASS}}'
  exposes:
  - type: rest
    namespace: client-admin-status-rest
    port: 8080
    description: REST adapter for frp Client Admin API — Status. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/api/status
      name: api-status
      description: REST surface for api-status.
      operations:
      - method: GET
        name: getstatus
        description: Get proxy status
        call: client-admin-status.getstatus
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: client-admin-status-mcp
    port: 9090
    transport: http
    description: MCP adapter for frp Client Admin API — Status. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: get-proxy-status
      description: Get proxy status
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: client-admin-status.getstatus
      outputParameters:
      - type: object
        mapping: $.
