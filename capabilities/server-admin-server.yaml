naftiko: 1.0.0-alpha2
info:
  label: frp Server Admin API — Server
  description: 'frp Server Admin API — Server. 1 operations. Lead operation: Get server info. Self-contained Naftiko capability
    covering one Frp business surface.'
  tags:
  - Frp
  - Server
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    FRP_API_KEY: FRP_API_KEY
capability:
  consumes:
  - type: http
    namespace: server-admin-server
    baseUri: http://{host}:{port}
    description: frp Server Admin API — Server business capability. Self-contained, no shared references.
    resources:
    - name: api-serverinfo
      path: /api/serverinfo
      operations:
      - name: getserverinfo
        method: GET
        description: Get server info
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: basic
      username: '{{env.FRP_USER}}'
      password: '{{env.FRP_PASS}}'
  exposes:
  - type: rest
    namespace: server-admin-server-rest
    port: 8080
    description: REST adapter for frp Server Admin API — Server. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/api/serverinfo
      name: api-serverinfo
      description: REST surface for api-serverinfo.
      operations:
      - method: GET
        name: getserverinfo
        description: Get server info
        call: server-admin-server.getserverinfo
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: server-admin-server-mcp
    port: 9090
    transport: http
    description: MCP adapter for frp Server Admin API — Server. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: get-server-info
      description: Get server info
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: server-admin-server.getserverinfo
      outputParameters:
      - type: object
        mapping: $.
