      operations:
      - method: GET
        name: getproxyconfig
        description: Get proxy configuration
        call: frp.getproxyconfig
        with:
          name: rest.name
        outputParameters:
        - type: object
          mapping: $.
    - path: /api/visitor/{name}/config
