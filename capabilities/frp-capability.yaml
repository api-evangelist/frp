      - method: GET
        name: getstoreproxy
        description: Get stored proxy
        call: frp.getstoreproxy
        with:
          name: rest.name
        outputParameters:
        - type: object
          mapping: $.
    - path: /api/store/proxies/{name}
      name: updatestoreproxy
      operations:
      - method: PUT
        name: updatestoreproxy
        description: Update stored proxy
        call: frp.updatestoreproxy
