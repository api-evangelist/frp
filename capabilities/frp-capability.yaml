naftiko: 1.0.0-alpha2
info:
  label: frp Client Admin API
  description: The frp client (frpc) exposes a built-in HTTP admin API on its local web server. The API lets operators inspect
    or hot-reload the client configuration, stop the client, query proxy and visitor status, and (when a configuration store
    is enabled) manage stored proxy and visitor definitions. All routes (except /healthz) require HTTP Basic authentication
    using the user and password configured in webServer.user and webServer.password.
  tags:
  - Frp
  - API
  created: '2026-05-06'
  modified: '2026-05-06'
capability:
  consumes:
  - type: http
    namespace: frp
    baseUri: http://127.0.0.1:7400
    description: frp Client Admin API HTTP API.
    authentication:
      type: basic
      username: '{{FRP_USERNAME}}'
      password: '{{FRP_PASSWORD}}'
    resources:
    - name: healthz
      path: /healthz
      operations:
      - name: gethealthz
        method: GET
        description: Health check
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: api-reload
      path: /api/reload
      operations:
      - name: reloadconfig
        method: GET
        description: Reload configuration
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: api-stop
      path: /api/stop
      operations:
      - name: stopclient
        method: POST
        description: Stop client
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: api-status
      path: /api/status
      operations:
      - name: getstatus
        method: GET
        description: Get proxy status
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: api-config
      path: /api/config
      operations:
      - name: getconfig
        method: GET
        description: Get current configuration
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: putconfig
        method: PUT
        description: Replace configuration
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: api-proxy-name-config
      path: /api/proxy/{name}/config
      operations:
      - name: getproxyconfig
        method: GET
        description: Get proxy configuration
        inputParameters:
        - name: name
          in: path
          type: string
          required: true
          description: Proxy name
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: api-visitor-name-config
      path: /api/visitor/{name}/config
      operations:
      - name: getvisitorconfig
        method: GET
        description: Get visitor configuration
        inputParameters:
        - name: name
          in: path
          type: string
          required: true
          description: Visitor name
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: api-store-proxies
      path: /api/store/proxies
      operations:
      - name: liststoreproxies
        method: GET
        description: List stored proxies
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createstoreproxy
        method: POST
        description: Create stored proxy
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: api-store-proxies-name
      path: /api/store/proxies/{name}
      operations:
      - name: getstoreproxy
        method: GET
        description: Get stored proxy
        inputParameters:
        - name: name
          in: path
          type: string
          required: true
          description: Stored proxy name
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: updatestoreproxy
        method: PUT
        description: Update stored proxy
        inputParameters:
        - name: name
          in: path
          type: string
          required: true
          description: Stored proxy name
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: deletestoreproxy
        method: DELETE
        description: Delete stored proxy
        inputParameters:
        - name: name
          in: path
          type: string
          required: true
          description: Stored proxy name
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: api-store-visitors
      path: /api/store/visitors
      operations:
      - name: liststorevisitors
        method: GET
        description: List stored visitors
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createstorevisitor
        method: POST
        description: Create stored visitor
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: api-store-visitors-name
      path: /api/store/visitors/{name}
      operations:
      - name: getstorevisitor
        method: GET
        description: Get stored visitor
        inputParameters:
        - name: name
          in: path
          type: string
          required: true
          description: Stored visitor name
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: updatestorevisitor
        method: PUT
        description: Update stored visitor
        inputParameters:
        - name: name
          in: path
          type: string
          required: true
          description: Stored visitor name
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: deletestorevisitor
        method: DELETE
        description: Delete stored visitor
        inputParameters:
        - name: name
          in: path
          type: string
          required: true
          description: Stored visitor name
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    port: 8080
    namespace: frp-rest
    description: REST adapter for frp Client Admin API.
    resources:
    - path: /healthz
