      - method: GET
        name: gethealthz
        description: Health check
        call: frp.gethealthz
        outputParameters:
        - type: object
          mapping: $.
    - path: /api/reload
      name: reloadconfig
      operations:
      - method: GET
        name: reloadconfig
        description: Reload configuration
        call: frp.reloadconfig
        outputParameters:
        - type: object
          mapping: $.
    - path: /api/stop
