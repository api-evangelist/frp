          mapping: $.
    - path: /api/store/visitors/{name}
      name: getstorevisitor
      operations:
      - method: GET
        name: getstorevisitor
        description: Get stored visitor
        call: frp.getstorevisitor
        with:
          name: rest.name
        outputParameters:
