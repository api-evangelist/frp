openapi: 3.2.0
info:
  title: frp Server Admin Metrics API
  description: The frp server (frps) exposes a built-in HTTP admin API on its dashboard web server. The API returns runtime information about the frps process, connected clients, and active proxies, and lets operators inspect proxy traffic statistics or clear offline proxies. All routes (except /healthz) require HTTP Basic authentication using the dashboard user and password configured in webServer.user and webServer.password.
  version: 0.0.1
  contact:
    name: frp
    url: https://gofrp.org/
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
- url: http://{host}:{port}
  description: frp server dashboard (frps webServer)
  variables:
    host:
      default: localhost
      description: Address where frps webServer is listening (webServer.addr)
    port:
      default: '7500'
      description: Port where frps webServer is listening (webServer.port)
security:
- BasicAuth: []
tags:
- name: Metrics
  description: Prometheus metrics endpoint
paths:
  /metrics:
    get:
      tags:
      - Metrics
      summary: Prometheus metrics
      description: Exposes Prometheus-format metrics for the frps process. Only available when enablePrometheus is set to true in the server configuration.
      operationId: getMetrics
      responses:
        '200':
          description: Prometheus metrics in text exposition format
          content:
            text/plain:
              schema:
                type: string
components:
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
      description: HTTP Basic auth using webServer.user and webServer.password
