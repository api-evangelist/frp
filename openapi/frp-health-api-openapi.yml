openapi: 3.2.0
info:
  title: Frp Health API
  version: 0.0.1
  contact:
    name: frp
    url: https://gofrp.org/
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  description: 'Operations tagged Health across 2 of this provider''s published API definitions: frp-client-admin-api-openapi.yml, frp-server-admin-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: http://{host}:{port}
  description: frp client admin server (frpc webServer)
  variables:
    host:
      default: 127.0.0.1
      description: Address where frpc webServer is listening (webServer.addr)
    port:
      default: '7400'
      description: Port where frpc webServer is listening (webServer.port)
security:
- BasicAuth: []
tags:
- name: Health
  description: Liveness probe
paths:
  /healthz:
    get:
      tags:
      - Health
      summary: Health check
      description: Returns HTTP 200 when the client is running. This route requires no authentication.
      operationId: getHealthz
      security: []
      responses:
        '200':
          description: Client is healthy
    servers:
    - url: http://{host}:{port}
      description: frp client admin server (frpc webServer)
      variables:
        host:
          default: 127.0.0.1
          description: Address where frpc webServer is listening (webServer.addr)
        port:
          default: '7400'
          description: Port where frpc webServer is listening (webServer.port)
components:
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
      description: HTTP Basic auth using webServer.user and webServer.password
x-refined-from:
- frp-client-admin-api-openapi.yml
- frp-server-admin-api-openapi.yml
