aid: frp
name: frp
description: >-
  frp is an open-source fast reverse proxy that exposes services running behind a NAT or firewall to the public
  internet. Both the server (frps) and the client (frpc) include built-in HTTP admin APIs that operators can use to
  inspect runtime status, manage proxies and visitors, hot-reload configuration, and scrape Prometheus metrics.
